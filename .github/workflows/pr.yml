name: PR Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6 # the version package.json's packageManager names

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      # The built CLI against the fixture site, in a real browser, recording:
      # the browser and the ffmpeg are Playwright's own.
      - run: pnpm exec playwright install --with-deps chromium-headless-shell ffmpeg

      - run: pnpm test:e2e

      # What a release would publish: the files, and that it packs.
      - run: npm pack --dry-run
